# Simulation Parameters
SIM_PERIOD: 0.1       # [s]
# SIM_DIRECTION: 1.57   # [rad]
# SLOW_VELOCITY_TH: 0.1 # [m/s]

YAWRATE_SAMPLES: 20

# Cost Parameters
OBSTACLE_COST_GAIN: 1.0
TO_GOAL_COST_GAIN: 0.8
TO_GOAL_ORIENTATION_COST_GAIN: 0.2 # Gain for the cost of orientation towards the goal
SPEED_COST_GAIN: 0.4    # If path cost is used, setting the param "SPEED_COST_GAIN" to a value close to the param "PATH_COST_GAIN" may indicate better behavior

OBS_RANGE: 2.5          # [m]

# real needed params
# Target Parameters
TARGET_VELOCITY: 2.0 # [m/s]
STEER_ANGLE_SAMPLES: 10
VELOCITY_SAMPLES: 10
GOAL_THRESHOLD: 0.1           # [m]

PREDICT_TIME: 2.0     # [s]
SIM_TIME_SAMPLES: 10 # trajctory collision check samples

ANGLE_RESOLUTION: 0.087 # [rad] obstacle angle resolution from costmap, 0.087 rad ~= 5 deg

